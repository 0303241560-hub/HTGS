<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTGS - Quản lý sinh viên</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <div>
            <h1>HỆ THỐNG ĐIỂM DANH IoT</h1>
            <p>Quản lý sinh viên</p>
        </div>

        <div class="firebase-status">
            <span id="statusDot"></span>
            <span id="firebaseStatus">Đang kết nối...</span>
        </div>
    </header>

    <main>

        <!-- FORM -->
        <section class="card">

            <h2 id="formTitle">Thêm sinh viên</h2>

            <form id="studentForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Mã sinh viên</label>
                        <input
                            type="text"
                            id="studentId"
                            placeholder="VD: SV003"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Họ và tên</label>
                        <input
                            type="text"
                            id="studentName"
                            placeholder="Nguyễn Văn C"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>RFID UID</label>
                        <input
                            type="text"
                            id="rfidUid"
                            placeholder="VD: A1B2C3D4"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Fingerprint ID</label>
                        <input
                            type="number"
                            id="fingerprintId"
                            placeholder="VD: 3"
                            min="1"
                            required
                        >
                    </div>

                </div>

                <div class="button-group">

                    <button type="submit" class="btn-primary">
                        Lưu sinh viên
                    </button>

                    <button
                        type="button"
                        id="cancelBtn"
                        class="btn-secondary hidden"
                    >
                        Hủy sửa
                    </button>

                </div>

            </form>

        </section>


        <!-- DANH SÁCH -->
        <section class="card">

            <div class="list-header">

                <div>
                    <h2>Danh sách sinh viên</h2>
                    <p id="studentCount">0 sinh viên</p>
                </div>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="🔍 Tìm sinh viên..."
                >

            </div>


            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>MSSV</th>
                            <th>Họ tên</th>
                            <th>RFID UID</th>
                            <th>Fingerprint ID</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>

                    <tbody id="studentTableBody">

                    </tbody>

                </table>

                <div id="emptyMessage" class="empty">
                    Chưa có sinh viên
                </div>

            </div>

        </section>

    </main>

</div>


<!-- JAVASCRIPT -->
<script type="module" src="app.js"></script>

</body>
</html>
